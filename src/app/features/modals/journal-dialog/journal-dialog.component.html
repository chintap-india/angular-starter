<div class="max-h-[85vh] max-h-[85dvh] flex flex-col p-5 sm:p-8 max-w-2xl w-full mx-auto bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 transition-colors" role="dialog" [attr.aria-labelledby]="'journal-title-' + article.id">
  <!-- Fixed Top meta & close -->
  <div class="flex-shrink-0 flex items-start justify-between pb-4 border-b border-stone-200 dark:border-stone-800">
    <div>
      <div class="flex items-center gap-2 text-xs font-semibold text-stone-700 dark:text-stone-300 uppercase tracking-wider">
        <span>{{ article.category }}</span>
        <span>•</span>
        <span>{{ article.date }}</span>
        <span>•</span>
        <span>{{ article.readTime }}</span>
      </div>
      <h2 [id]="'journal-title-' + article.id" class="text-2xl sm:text-3xl font-extrabold text-stone-900 dark:text-stone-50 font-heading mt-2 leading-tight">
        {{ article.title }}
      </h2>
    </div>
    <button
      type="button"
      (click)="dialogRef.close()"
      aria-label="Close article"
      class="modal-close-btn w-8 h-8 rounded-full flex items-center justify-center bg-stone-200/70 hover:bg-stone-300 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-300 hover:text-stone-900 dark:hover:text-white transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ea1c24] cursor-pointer flex-shrink-0 mt-1"
      title="Close article"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Scrollable Article Body -->
  <div class="flex-1 overflow-y-auto overscroll-contain py-4 pr-1 space-y-4 text-stone-800 dark:text-stone-200 text-sm sm:text-base leading-relaxed min-h-0">
    <p class="font-medium text-stone-900 dark:text-stone-100 text-base sm:text-lg border-l-2 border-stone-800 dark:border-rose-500 pl-4 py-1 italic">
      {{ article.excerpt }}
    </p>

    @for (para of article.content; track para) {
      <p>{{ para }}</p>
    }
  </div>

  <!-- Pinned Footer signoff (Always visible at the bottom) -->
  <div class="flex-shrink-0 pt-4 border-t border-stone-200 dark:border-stone-800 flex items-center justify-between text-xs text-stone-700 dark:text-stone-300 bg-stone-50 dark:bg-stone-900">
    <span>Published by Chintap Journal</span>
    <button
      mat-flat-button
      (click)="dialogRef.close()"
      aria-label="Close article"
      class="!bg-stone-900 dark:!bg-stone-100 !text-white dark:!text-stone-900 px-6 py-2.5 font-bold hover:!bg-stone-800 dark:hover:!bg-white transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ea1c24]"
    >
      Close
    </button>
  </div>
</div>
