<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
      .brand-title { font-family: 'Poppins', -apple-system, sans-serif; font-weight: 900; }
      .brand-pill { font-family: 'Space Grotesk', monospace; font-weight: 700; letter-spacing: 0.14em; }
      .headline { font-family: 'Poppins', -apple-system, sans-serif; font-weight: 900; letter-spacing: -1px; }
      .subhead { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 500; }
      .pillar-num { font-family: 'Space Grotesk', monospace; font-weight: 700; }
      .pillar-name { font-family: 'Poppins', -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
      .pillar-sub { font-family: 'Space Grotesk', monospace; font-weight: 700; letter-spacing: 0.02em; }
      .pillar-desc { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 500; line-height: 1.5; }
      .meta-text { font-family: 'Space Grotesk', monospace; font-weight: 600; letter-spacing: 0.06em; }
    </style>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1200" height="630" fill="#ffffff" />
  
  <!-- Red Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#EA1C24" />

  <!-- Top Navigation & Brand Header -->
  <g transform="translate(72, 42)">
    <!-- Official Emblem -->
    <svg viewBox="0 0 1000 1000" width="34" height="34" fill="none">
      <path d="M 469.7 50.0 L 520.8 51.9 L 558.6 63.2 L 583.2 76.5 L 602.1 89.7 L 624.8 112.4 L 639.9 133.2 L 655.0 161.6 L 666.4 203.2 L 666.4 252.3 L 656.9 288.2 L 645.6 312.8 L 632.4 333.6 L 611.6 356.3 L 579.4 379.0 L 577.5 379.0 L 577.5 329.8 L 570.0 301.5 L 558.6 282.6 L 543.5 267.4 L 520.8 254.2 L 498.1 248.5 L 475.4 248.5 L 447.1 258.0 L 422.5 276.9 L 411.1 292.0 L 399.8 320.4 L 397.9 329.8 L 397.9 379.0 L 365.8 356.3 L 346.8 335.5 L 331.7 312.8 L 320.4 288.2 L 310.9 248.5 L 310.9 203.2 L 320.4 167.2 L 339.3 129.4 L 350.6 114.3 L 375.2 89.7 L 399.8 72.7 L 433.8 57.6 L 469.7 50.0 Z" fill="#EA1C24" />
      <path d="M 477.3 280.7 L 505.7 282.6 L 520.8 290.1 L 535.9 305.3 L 541.6 314.7 L 545.4 326.1 L 545.4 473.5 L 551.1 479.2 L 611.6 501.9 L 621.0 507.6 L 630.5 509.5 L 639.9 515.1 L 753.4 560.5 L 774.2 579.4 L 785.5 604.0 L 787.4 611.6 L 787.4 802.5 L 779.8 834.7 L 770.4 857.4 L 755.3 881.9 L 728.8 910.3 L 702.3 929.2 L 668.3 944.3 L 639.9 950.0 L 456.5 950.0 L 424.4 942.4 L 394.1 927.3 L 379.0 916.0 L 360.1 897.1 L 348.7 881.9 L 222.1 685.3 L 214.5 666.4 L 212.6 634.2 L 218.3 619.1 L 229.6 607.8 L 241.0 602.1 L 248.5 600.2 L 273.1 602.1 L 312.8 621.0 L 416.8 721.2 L 428.2 730.7 L 430.0 728.8 L 430.0 329.8 L 433.8 316.6 L 441.4 303.4 L 458.4 288.2 L 477.3 280.7 Z" fill="#111111" />
    </svg>
    
    <!-- Brand Wordmark -->
    <text x="46" y="25" class="brand-title" font-size="27" fill="#111111" letter-spacing="-0.7">chin<tspan fill="#EA1C24">tap</tspan></text>
    
    <!-- Tagline Badge -->
    <g transform="translate(196, 2)">
      <rect x="0" y="0" width="224" height="28" rx="14" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#EA1C24" />
      <text x="26" y="18" class="brand-pill" font-size="11.5" fill="#52525b">THINGS · APPS · POSSIBILITIES</text>
    </g>
    
    <!-- Website URL -->
    <text x="1056" y="24" text-anchor="end" class="meta-text" font-size="15" fill="#71717a">chintap.com</text>
  </g>

  <!-- Headline & Subheadline Block -->
  <g transform="translate(72, 142)">
    <text x="0" y="0" class="headline" font-size="38" fill="#111111">Ideas don't come with a format.</text>
    <text x="0" y="44" class="headline" font-size="38" fill="#EA1C24">Neither should we.</text>
    <text x="0" y="86" class="subhead" font-size="17" fill="#52525b">
      Some ideas become things. Others become apps. And some lead somewhere neither started out expecting.
    </text>
  </g>

  <!-- Divider Line Above Pillars -->
  <line x1="72" y1="286" x2="1128" y2="286" stroke="#f4f4f5" stroke-width="1" />

  <!-- 3 Pillars Grid -->
  <g transform="translate(72, 320)">
    <!-- 01 THINGS -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="28" height="22" rx="6" fill="#fee2e2" />
      <text x="14" y="15" text-anchor="middle" class="pillar-num" font-size="12" fill="#EA1C24">01</text>
      <text x="38" y="17" class="pillar-name" font-size="24" fill="#111111">Things</text>
      <text x="0" y="44" class="pillar-sub" font-size="13.5" fill="#EA1C24">Physical things</text>
      <text x="0" y="70" class="pillar-desc" font-size="14.5" fill="#52525b">
        <tspan x="0" dy="0">Objects, tools and products that solve</tspan>
        <tspan x="0" dy="22">everyday problems or make experiences</tspan>
        <tspan x="0" dy="22">better.</tspan>
      </text>
    </g>

    <!-- 02 APPS -->
    <g transform="translate(372, 0)">
      <rect x="0" y="0" width="28" height="22" rx="6" fill="#fee2e2" />
      <text x="14" y="15" text-anchor="middle" class="pillar-num" font-size="12" fill="#EA1C24">02</text>
      <text x="38" y="17" class="pillar-name" font-size="24" fill="#111111">Apps</text>
      <text x="0" y="44" class="pillar-sub" font-size="13.5" fill="#EA1C24">Useful software</text>
      <text x="0" y="70" class="pillar-desc" font-size="14.5" fill="#52525b">
        <tspan x="0" dy="0">Simple tools and applications that make</tspan>
        <tspan x="0" dy="22">something easier, clearer or more</tspan>
        <tspan x="0" dy="22">useful.</tspan>
      </text>
    </g>

    <!-- 03 POSSIBILITIES -->
    <g transform="translate(744, 0)">
      <rect x="0" y="0" width="28" height="22" rx="6" fill="#fee2e2" />
      <text x="14" y="15" text-anchor="middle" class="pillar-num" font-size="12" fill="#EA1C24">03</text>
      <text x="38" y="17" class="pillar-name" font-size="24" fill="#111111">Possibilities</text>
      <text x="0" y="44" class="pillar-sub" font-size="13.5" fill="#EA1C24">Beyond categories</text>
      <text x="0" y="70" class="pillar-desc" font-size="14.5" fill="#52525b">
        <tspan x="0" dy="0">Ideas that bring different things together,</tspan>
        <tspan x="0" dy="22">take an unexpected direction, or</tspan>
        <tspan x="0" dy="22">become something entirely new.</tspan>
      </text>
    </g>
  </g>

  <!-- Divider Line Above Footer -->
  <line x1="72" y1="560" x2="1128" y2="560" stroke="#f4f4f5" stroke-width="1" />

  <!-- Bottom Brand Sign-off -->
  <g transform="translate(72, 592)">
    <text x="0" y="0" class="meta-text" font-size="12.5" fill="#71717a">
      Chintap <tspan fill="#EA1C24"> · </tspan> Bengaluru <tspan fill="#EA1C24"> · </tspan> Exploring ideas &amp; building useful things
    </text>
  </g>
</svg>
